<div class="auth-page">
  <div class="auth-card card">

    <div class="auth-head">
      <div class="auth-icon">🎲</div>
      <h1>Create account</h1>
      <p>Join and start shopping</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input id="username" class="form-control" type="text"
          formControlName="username" placeholder="Your username" autocomplete="username">
        @if (form.get('username')?.invalid && form.get('username')?.touched) {
          <span class="form-error">Minimum 3 characters</span>
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" class="form-control" type="password"
          formControlName="password" placeholder="Minimum 6 characters" autocomplete="new-password">
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="form-error">Minimum 6 characters</span>
        }
      </div>

      <button class="btn btn-primary btn-full" type="submit" [disabled]="loading">
        @if (loading) { <span class="spinner spinner-xs"></span> }
        {{ loading ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-foot">
      Already have an account?
      <a routerLink="/auth/login">Sign in</a>
    </p>
  </div>
</div>
